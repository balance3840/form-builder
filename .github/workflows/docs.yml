name: Docs

# Builds the documentation site (website/) and the playground (the standalone builder) and publishes them to GitHub Pages.
# In the repository settings, set Pages > Source to "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['website/**', 'src/**', 'README.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # the builder links the generator from the sibling folder (file:../form-generator), so check out both side by side
      - uses: actions/checkout@v4
        with:
          path: form-builder
      - uses: actions/checkout@v4
        with:
          repository: balance3840/form-generator
          path: form-generator
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            form-builder/package-lock.json
            form-builder/website/package-lock.json
      - name: Build the generator
        working-directory: form-generator
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci && npm run build
      - name: Build the playground
        working-directory: form-builder
        run: |
          npm ci
          npm run build:playground
      - name: Build the docs
        working-directory: form-builder/website
        run: |
          npm ci
          npm run split   # website/docs is generated from README.md
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: form-builder/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
